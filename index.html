<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ㄋㄋㄗ乙女GAME</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app" class="app">
    <section id="stage" class="stage">
    <!-- 背景 -->
    <div class="bg"></div>

    <!-- UI -->
    <img class="ui-save" src="material/save.png" />
    <img class="ui-auto" src="amaterial/auto.png" />
    <img class="ui-bar" src="material/bar.png" />

      <!-- 角色圖 -->
      <img id="character" class="character floaty" src="material/平.png" alt="角色" />

      <!-- 選項面板（換裝） -->
      <div id="choices" class="choices hidden">
        <img class="choices-panel" src="material/三項.png" alt="選項面板" />
        <button class="choice" data-outfit="red">
          <img src="material/選項1.png" alt="選項1" />
          <span>大紅裝</span>
        </button>
        <button class="choice" data-outfit="sailor">
          <img src="material/選項2.png" alt="選項2" />
          <span>水手服</span>
        </button>
        <button class="choice" data-outfit="leaf">
          <img src="material/選項3.png" alt="選項3" />
          <span>一片葉子</span>
        </button>
      </div>

      <!-- 對話框 -->
      <div class="dialog">
        <img class="dialog-box" src="material/dialog_box.png" alt="對話框" />
        <div class="nameplate">
          <img class="namebg" src="material/namebg.png" alt="" />
          <img class="nameapple" src="material/name-apple.png" alt="" />
          <span id="speaker">平蘋</span>
        </div>

        <div id="text" class="text"></div>

        <button id="next" class="next">
          <img src="material/arrow.png" alt="下一句" />
        </button>
      </div>

      <!-- 首頁覆蓋層（點一下開始） -->
      <div id="home" class="home">
        <div class="home-card">
          <h1>ㄋㄋㄗ乙女GAME</h1>
          <p>我來了！</p>
          <button id="start" class="start-btn">START</button>
        </div>
      </div>
    </section>
   </section>
</main>

  <script src="app.js"></script>
</body>
</html>
